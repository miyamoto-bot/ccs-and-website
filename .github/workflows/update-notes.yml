name: Update note articles

on:
  schedule:
    - cron: '0 18 * * *'   # 毎日 03:00（日本時間）
  workflow_dispatch:       # 手動実行も可能（Actions タブ → Run workflow）

permissions:
  contents: write

concurrency:
  group: update-notes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: note の RSS から notes.json を作成
        run: node scripts/update-notes.mjs

      - name: 変更があればコミット
        run: |
          if [ -z "$(git status --porcelain -- notes.json)" ]; then
            echo "変更なし。コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes.json
          git commit -m "note の記事一覧を更新"
          git push
